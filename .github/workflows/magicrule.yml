name: MagicRule check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - surge/magicrule.json
      - surge/template.conf
      - worker/src/magic-rules.js
      - worker/scripts/check-magic-rules.js
      - .github/workflows/magicrule.yml
  push:
    branches: [develop, master]
    paths:
      - surge/magicrule.json
      - surge/template.conf
      - worker/src/magic-rules.js
      - worker/scripts/check-magic-rules.js
      - .github/workflows/magicrule.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Schedules run from the default branch only, so they check both deployed registries explicitly.
        branch: ${{ fromJSON(github.event_name == 'schedule' && '["master","develop"]' || '[""]') }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/generate-assets.js
      - run: node scripts/check-magic-rules.js
