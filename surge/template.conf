{{MANAGED_CONFIG}}

# Available modules:
{{MODULE_URL_LINES}}

[General]
loglevel = notify
ipv6 = false
ipv6-vif = off
block-quic = all-proxy

test-timeout = 5
internet-test-url = http://www.gstatic.com/generate_204
proxy-test-url = http://www.gstatic.com/generate_204

geoip-maxmind-url = https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country-without-asn.mmdb

exclude-simple-hostnames = true
dns-server = 223.5.5.5, 119.29.29.29, system
# encrypted-dns-server = https://cloudflare-dns.com/dns-query, https://dns.google/dns-query
# encrypted-dns-follow-outbound-mode = true
hijack-dns = 8.8.8.8:53, 8.8.4.4:53

read-etc-hosts = true
skip-proxy = yunbusiness.ccb.com, www.abchina.com.cn, *.psbc.com, *.bosc.cn
always-raw-tcp-keywords = "Content-Type: application/pairing+tlv8"

[Host]
zslab.ai = server:223.5.5.5, 119.29.29.29
*.zslab.ai = server:223.5.5.5, 119.29.29.29
dns.alidns.com = server:223.5.5.5, 119.29.29.29
doh.pub = server:223.5.5.5, 119.29.29.29
DOMAIN-SET:https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/direct.txt = server:{{DIRECT_DNS_SERVERS}}

[Proxy]
{{PROXY_LINES}}

[Proxy Group]
🇺🇸 US = smart, hidden=true, {{NODE_GROUP:🇺🇸 US}}
🇯🇵 JP = smart, hidden=true, {{NODE_GROUP:🇯🇵 JP}}
🇺🇸🏠 US ISP = smart, hidden=true, {{NODE_GROUP:🇺🇸🏠 US ISP}}

Auto = smart, include-all-proxies=true, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png

Proxy = select, 🇺🇸 US, 🇯🇵 JP, 🇺🇸🏠 US ISP, Auto, DIRECT, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
AIProxy = select, 🇺🇸🏠 US ISP, 🇺🇸 US, 🇯🇵 JP, Auto, Proxy, DIRECT, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AI.png
iCloud = select, DIRECT, 🇺🇸 US, 🇯🇵 JP, 🇺🇸🏠 US ISP, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/iCloud.png
AppleDirect = select, DIRECT, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
AppleProxy = select, Proxy, DIRECT, 🇺🇸 US, 🇯🇵 JP, 🇺🇸🏠 US ISP, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
WeChat = select, DIRECT, 🇺🇸 US, 🇯🇵 JP, 🇺🇸🏠 US ISP, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/WeChat.png
Telegram = select, 🇺🇸 US, 🇯🇵 JP, 🇺🇸🏠 US ISP, Proxy, DIRECT, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
X = select, 🇺🇸🏠 US ISP, 🇺🇸 US, 🇯🇵 JP, Proxy, DIRECT, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/X.png
YouTube = select, 🇺🇸 US, 🇯🇵 JP, 🇺🇸🏠 US ISP, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
GlobalMedia = select, 🇺🇸🏠 US ISP, 🇺🇸 US, 🇯🇵 JP, Auto, Proxy, DIRECT, icon-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Media.png

[Rule]
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT,no-resolve

{{RULE_LINES}}

RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/WeChat/WeChat.list,WeChat,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Binance}},DIRECT,no-resolve,update-interval=86400

# Apple lists overlap: iCloud first, then AppleDirect before AppleProxy; the full Apple list catches remaining services.
RULE-SET,{{RULESET_iCloud}},iCloud,no-resolve,update-interval=86400
RULE-SET,{{RULESET_AppleDirect}},AppleDirect,no-resolve,update-interval=86400,hidden=true
RULE-SET,{{RULESET_AppleProxy}},AppleProxy,no-resolve,update-interval=86400,hidden=true
RULE-SET,{{RULESET_Apple}},AppleProxy,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Direct}},DIRECT,no-resolve,update-interval=86400

RULE-SET,{{RULESET_OpenAI}},AIProxy,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Bing}},AIProxy,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Copilot}},AIProxy,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Anthropic}},AIProxy,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Gemini}},AIProxy,no-resolve,update-interval=86400

RULE-SET,{{RULESET_Telegram}},Telegram,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Twitter}},X,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Discord}},Proxy,no-resolve,update-interval=86400
RULE-SET,{{RULESET_YouTube}},YouTube,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Cloudflare}},Proxy,no-resolve,update-interval=86400

RULE-SET,{{RULESET_Netflix}},GlobalMedia,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Disney}},GlobalMedia,no-resolve,update-interval=86400
RULE-SET,{{RULESET_Hulu}},GlobalMedia,no-resolve,update-interval=86400
RULE-SET,{{RULESET_IMDB}},GlobalMedia,no-resolve,update-interval=86400
RULE-SET,{{RULESET_GlobalMedia}},GlobalMedia,no-resolve,update-interval=86400

DOMAIN-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/direct.txt,DIRECT
GEOIP,CN,DIRECT
FINAL,Proxy,dns-failed

[MITM]
{{MITM_LINES}}
